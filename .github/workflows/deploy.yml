# 推送 main 自动构建并发布到 GitHub Pages
# 绑定自定义域名后无需改此文件；换其他平台（Vercel / EdgeOne）时删除即可
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新推送取消旧的
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build and upload site
        uses: withastro/action@v3
        with:
          node-version: 22

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行自动创建 Pages 站点，无需手动到仓库设置里开启
          enablement: true

      - name: Remove stale Pages artifact (avoids 409 conflict on retry or re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" && echo "removed artifact ${id}"
            done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
